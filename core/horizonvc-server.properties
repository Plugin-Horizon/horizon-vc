# HorizonVC server settings (Java-style key=value file).

# UDP port of the voice server. -1 reuses the game's server-port.
port=24454
# Address the voice socket binds to. Empty falls back to server-ip from server.properties, * means all addresses.
bind_address=
# Farthest distance, in blocks, at which normal speech is heard.
max_voice_distance=48.0
# Farthest distance, in blocks, at which whispering is heard.
whisper_distance=24.0
# Audio codec handed to clients: VOIP, AUDIO or RESTRICTED_LOWDELAY.
codec=VOIP
# Largest audio datagram payload in bytes.
mtu_size=1275
# Cap on voice-channel messages accepted from one player per second. -1 means no cap.
tcp_rate_limit=16
# Interval between keep-alive packets, in milliseconds.
keep_alive=1000
# Whether players may create and join groups.
enable_groups=true
# Host name (optionally with a port) that clients are told to use for the voice connection. Empty lets clients derive it.
voice_host=
# Whether clients may record the audio they hear.
allow_recording=true
# Radius, in blocks, in which audio is forwarded. Any negative value means max_voice_distance.
broadcast_range=-1.0
# Whether players who do not have the client mod are removed from the server.
force_voice_chat=false
# How long, in milliseconds, to wait for a joining player's client mod to report in before treating it as absent.
login_timeout=10000
# Accepted for compatibility, not used yet: spectators talking to other players.
spectator_interaction=false
# Accepted for compatibility, not used yet: spectators talking to the player they are watching.
spectator_player_possession=false
# Accepted for compatibility, not used yet: answering pings from outside.
allow_pings=true
# Accepted for compatibility, not used yet: native audio libraries.
use_natives=true
# Accepted for compatibility, not used yet: multi-threaded server support.
threaded_server_support=true
